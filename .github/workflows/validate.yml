name: validate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: "Smoke de formulário contra produção (POST /api/leads)"
        type: boolean
        default: false

jobs:
  autopilotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar produção (autopilotos J0–J6, somente leitura)
        run: |
          node tests/autopilotos/simular.mjs --base https://www.imts.com.br
          code=$?
          if [ $code -eq 3 ]; then
            echo "::warning::Pré-vio: o app IMTS (imts-ecossistema) ainda não está publicado em www.imts.com.br — validação completa diferida até o deploy. Nenhum falso positivo será registrado."
            exit 0
          fi
          exit $code
      - name: J8 Conexões externas (guardas de contrato, sem criar dados)
        run: |
          node tests/autopilotos/simular_externas.mjs --base https://www.imts.com.br || code=$?
          code=${code:-0}
          if [ $code -eq 3 ]; then
            echo "::warning::J8 diferido: app ainda não publicado em produção."
            exit 0
          fi
          exit $code
      - name: Smoke de formulário em produção (sob demanda, exige deploy do app)
        if: ${{ inputs.live }}
        run: |
          node tests/autopilotos/simular_externas.mjs --base https://www.imts.com.br --live
          code=$?
          if [ $code -eq 3 ]; then
            echo "::error::Smoke live solicitado, mas o app não está publicado em produção."
            exit 1
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-autopilotos
          path: tests/autopilotos/relatorios/
